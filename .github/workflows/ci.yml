name: MotoSave CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  web:
    name: Web typecheck, tests, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm install
      - run: npm run typecheck:web
      - run: npm run test --workspace @motosave/web
      - run: npm run build:web

  mobile:
    name: Mobile TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck:mobile
      - name: Verify Expo SDK package compatibility
        working-directory: apps/mobile
        run: npx expo install --check

  edge-functions:
    name: Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/partner-operations/index.ts
      - run: deno check supabase/functions/demo-payment/index.ts
