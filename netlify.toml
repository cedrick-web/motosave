[build]
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22.13.0"

# MotoSave is a client-side Vite app. Use the index fallback for deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Conservative browser security headers. Provider integrations may need a reviewed CSP later.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
